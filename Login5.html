<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #650b3b, #9d185f, #d04d91);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* Main card */
        .login-container {
            width: 100%;
            max-width: 1050px;
            min-height: 650px;
            background: #ffffff;
            border-radius: 28px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 42% 58%;
            box-shadow:
                0 30px 80px rgba(42, 0, 25, 0.35);
        }

        /* =====================================
           LEFT DECORATIVE PANEL
        ====================================== */

        .left-panel {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    #8e1558,
                    #c34c91
                );
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
        }

        /* Large geometric shapes */

        .left-panel::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.08);
            transform: rotate(45deg);
            top: -220px;
            left: -280px;
        }

        .left-panel::after {
            content: "";
            position: absolute;
            width: 480px;
            height: 480px;
            border: 55px solid rgba(255, 255, 255, 0.08);
            transform: rotate(45deg);
            bottom: -250px;
            left: -180px;
        }

        .shape-one {
            position: absolute;
            width: 360px;
            height: 360px;
            border: 30px solid rgba(255, 255, 255, 0.09);
            transform: rotate(45deg);
            top: 120px;
            left: -220px;
        }

        .left-content {
            position: relative;
            z-index: 2;
        }

        .brand {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .left-content h2 {
            font-size: 42px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .left-content p {
            font-size: 16px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.85);
            max-width: 350px;
        }

        .decorative-circle {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            right: 35px;
            top: 45px;
        }

        .decorative-circle::after {
            content: "";
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            top: 25px;
            left: 25px;
        }


        /* =====================================
           RIGHT SIDE
        ====================================== */

        .right-panel {
            padding: 55px 75px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            margin: 0 auto 15px;

            background: linear-gradient(
                135deg,
                #d85a9c,
                #9d185f
            );

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 10px 25px rgba(157, 24, 95, 0.25);
        }

        .profile-icon svg {
            width: 42px;
            height: 42px;
            fill: none;
            stroke: white;
            stroke-width: 2;
        }

        .login-header h1 {
            color: #85134f;
            font-size: 27px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #999;
            font-size: 14px;
        }


        /* =====================================
           FORM
        ====================================== */

        .login-form {
            width: 100%;
        }

        .form-field {
            position: relative;
            margin-bottom: 23px;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            height: 52px;
            border: none;
            border-bottom: 1px solid #cfcfcf;
            outline: none;
            background: transparent;

            font-size: 14px;
            color: #333;

            padding: 10px 10px 10px 42px;

            transition: 0.3s ease;
        }

        .form-field input:focus,
        .form-field select:focus {
            border-bottom: 2px solid #b72d78;
        }

        .form-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #777;
            margin-bottom: 6px;
        }

        .field-icon {
            position: absolute;
            left: 10px;
            bottom: 15px;
            width: 20px;
            height: 20px;
            color: #999;
        }

        .field-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .form-field input:focus + .field-icon {
            color: #b72d78;
        }


        /* Forgot password */

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: -5px 0 25px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #777;
        }

        .remember input {
            accent-color: #b72d78;
        }

        .forgot-password {
            color: #b72d78;
            font-size: 12px;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }


        /* =====================================
           ACCOUNT TYPE
        ====================================== */

        .account-type {
            margin: 5px 0 25px;
        }

        .account-type-title {
            font-size: 13px;
            color: #777;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .account-options {
            display: flex;
            gap: 12px;
        }

        .account-option {
            flex: 1;
        }

        .account-option input {
            display: none;
        }

        .account-option label {
            display: block;
            text-align: center;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            color: #777;
            transition: 0.3s ease;
        }

        .account-option input:checked + label {
            background: #b72d78;
            color: white;
            border-color: #b72d78;
            box-shadow: 0 6px 15px rgba(183, 45, 120, 0.25);
        }


        /* =====================================
           LOGIN BUTTON
        ====================================== */

        .login-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 30px;

            background: linear-gradient(
                135deg,
                #d05a9b,
                #a51d65
            );

            color: white;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(165, 29, 101, 0.25);

            transition: 0.3s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 30px rgba(165, 29, 101, 0.35);
        }

        .login-button:active {
            transform: translateY(0);
        }


        /* =====================================
           DIVIDER
        ====================================== */

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0 20px;

            color: #aaa;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }


        /* =====================================
           SOCIAL LOGIN
        ====================================== */

        .social-login {
            display: flex;
            gap: 12px;
        }

        .social-button {
            flex: 1;
            height: 45px;

            border: 1px solid #e4e4e4;
            border-radius: 25px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            color: #555;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .social-button:hover {
            border-color: #b72d78;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .google-icon {
            color: #4285f4;
            font-weight: bold;
            font-size: 17px;
        }

        .facebook-icon {
            width: 19px;
            height: 19px;
            border-radius: 4px;
            background: #1877f2;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }


        /* =====================================
           FOOTER
        ====================================== */

        .signup-text {
            text-align: center;
            margin-top: 25px;

            color: #999;
            font-size: 13px;
        }

        .signup-text a {
            color: #a51d65;
            font-weight: 700;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }


        /* =====================================
           RESPONSIVE
        ====================================== */

        @media (max-width: 850px) {

            body {
                padding: 20px;
            }

            .login-container {
                grid-template-columns: 1fr;
                max-width: 550px;
            }

            .left-panel {
                min-height: 230px;
                padding: 40px;
            }

            .left-content h2 {
                font-size: 30px;
            }

            .left-content p {
                font-size: 14px;
            }

            .right-panel {
                padding: 45px 40px;
            }
        }


        @media (max-width: 500px) {

            body {
                padding: 0;
            }

            .login-container {
                min-height: 100vh;
                border-radius: 0;
            }

            .left-panel {
                min-height: 200px;
                padding: 35px 25px;
            }

            .brand {
                font-size: 28px;
            }

            .left-content h2 {
                font-size: 25px;
            }

            .left-content p {
                font-size: 13px;
            }

            .right-panel {
                padding: 35px 25px;
            }

            .profile-icon {
                width: 65px;
                height: 65px;
            }

            .login-header h1 {
                font-size: 23px;
            }

            .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <!-- =================================
             LEFT SIDE
        ================================== -->

        <section class="left-panel">

            <div class="shape-one"></div>

            <div class="decorative-circle"></div>

            <div class="left-content">
                 <h2>
                    Welcome<br>
                    Back.
                </h2>

                <p>
                    Sign in to continue your journey.
                    Manage your account, explore your
                    dashboard and stay connected.
                </p>

            </div>

        </section>


        <!-- =================================
             RIGHT SIDE
        ================================== -->

        <section class="right-panel">

            <div class="login-header">

                <div class="profile-icon">

                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"></path>
                    </svg>

                </div>

                <h1>LOGIN</h1>

                <p>Enter your details to continue</p>

            </div>


            <form action="" class="login-form">

                <!-- Full Name -->

                <div class="form-field">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                    >

                    <span class="field-icon">

                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"></path>
                        </svg>

                    </span>

                </div>


                <!-- Email -->

                <div class="form-field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >

                    <span class="field-icon">

                        <svg viewBox="0 0 24 24">
                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            ></rect>

                            <path d="M3 7l9 6 9-6"></path>
                        </svg>

                    </span>

                </div>


                <!-- Password -->

                <div class="form-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                    >

                    <span class="field-icon">

                        <svg viewBox="0 0 24 24">
                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                            ></rect>

                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>

                        </svg>

                    </span>

                </div>


                <!-- Phone -->

                <div class="form-field">

                    <label for="phoneNumber">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phoneNumber"
                        name="phoneNumber"
                        placeholder="+256 700 000 000"
                        required
                    >

                    <span class="field-icon">

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M6 2h3l2 5-2 2c1 3 3 5 6 6l2-2 5 2v3c0 1-1 2-2 2C10 20 4 14 4 5c0-1 1-3 2-3z"
                            ></path>
                        </svg>

                    </span>

                </div>


                <!-- Date of Birth -->

                <div class="form-field">

                    <label for="dateOfBirth">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dateOfBirth"
                        name="dateOfBirth"
                        required
                    >

                </div>


                <!-- Age -->

                <div class="form-field">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter your age"
                    >

                </div>


                <!-- Country -->

                <div class="form-field">

                    <label for="country">
                        Country
                    </label>

                    <select
                        name="country"
                        id="country"
                    >

                        <option value="">
                            Select your country
                        </option>

                        <option value="uganda">
                            Uganda
                        </option>

                        <option value="kenya">
                            Kenya
                        </option>

                        <option value="tanzania">
                            Tanzania
                        </option>

                        <option value="rwanda">
                            Rwanda
                        </option>

                    </select>

                </div>


                <!-- Account Type -->

                <div class="account-type">

                    <div class="account-type-title">
                        Account Type
                    </div>

                    <div class="account-options">

                        <div class="account-option">

                            <input
                                type="radio"
                                id="personal"
                                name="accountType"
                                value="personal"
                            >

                            <label for="personal">
                                Personal
                            </label>

                        </div>

                        <div class="account-option">

                            <input
                                type="radio"
                                id="business"
                                name="accountType"
                                value="business"
                            >

                            <label for="business">
                                Business
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Options -->

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        Remember me

                    </label>

                    <a
                        href="#"
                        class="forgot-password"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- Login -->

                <button
                    type="submit"
                    class="login-button"
                >
                    LOGIN
                </button>


                <!-- Divider -->

                <div class="divider">
                    Or Login With
                </div>


                <!-- Social Login -->

                <div class="social-login">

                    <button
                        type="button"
                        class="social-button"
                    >

                        <span class="google-icon">
                            G
                        </span>

                        Google

                    </button>


                    <button
                        type="button"
                        class="social-button"
                    >

                        <span class="facebook-icon">
                            f
                        </span>

                        Facebook

                    </button>

                </div>


                <!-- Sign Up -->

                <div class="signup-text">

                    Don't have an account?

                    <a href="#">
                        Sign Up
                    </a>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
