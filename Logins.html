<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #751344;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 600px;
            min-height: 400px;
            display: grid;
            grid-template-columns: 40% 60%;
            background-color: white;
            border-radius: 14px;
            overflow: hidden;
        }

        .welcome-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background-color: #bd5c91;
            color: white;
            text-align: center;
            font-weight: bold;
        }

        .form-panel {
            padding: 45px 40px;
        }

        h1 {
            margin: 0 0 35px;
            color: #751344;
            text-align: center;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #777;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 4px;
            border: none;
            border-bottom: 1px solid #aaa;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-bottom-color: #bd5c91;
        }

        .forgot-password {
            display: block;
            margin: 8px 0 22px;
            color: #bd5c91;
            font-size: 12px;
        }

        button {
            display: block;
            margin-left: auto;
            padding: 11px 28px;
            border: none;
            border-radius: 20px;
            background-color: #bd5c91;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #9b3d72;
        }

        @media (max-width: 650px) {
            .login-card {
                width: 90%;
                grid-template-columns: 1fr;
            }

            .welcome-panel {
                min-height: 120px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <section class="welcome-panel">
            <p>WELCOME BACK</p>
        </section>

        <section class="form-panel">
            <h1>LOGIN</h1>

            <form>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required>
                </div>

                <a class="forgot-password" href="#">Forgot Password?</a>
                <button type="submit">LOGIN</button>
            </form>
        </section>
    </main>
</body>
</html>
